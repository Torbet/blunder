[project]
name = "blunder"
version = "0.1.0"
description = "A Cheat Detection System for Online Chess"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.85",
]

[tool.uv.workspace]
members = [ "apps/*", "libs/*" ]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["blunder"]
