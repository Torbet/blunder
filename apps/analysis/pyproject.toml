[project]
name = "blunder-analysis"
version = "0.1.0"
dependencies = [
    "blunder-maia",
    "blunder-shared",
]

[project.scripts]
analyse = "blunder.analysis:analyse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blunder"]

[tool.uv.sources]
blunder-maia = { workspace = true }
blunder-shared = { workspace = true }
