[project]
name = "blunder-api"
version = "0.1.0"
dependencies = [
    "blunder-shared",
]

[project.scripts]
api = "blunder.api:api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blunder"]

[tool.uv.sources]
blunder-shared = { workspace = true }
