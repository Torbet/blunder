[project]
name = "blunder-ingestion"
version = "0.1.0"
dependencies = [
    "blunder-shared",
]

[project.scripts]
ingest = "blunder.ingestion:ingest"
convert = "blunder.ingestion:convert"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blunder"]

[tool.uv.sources]
blunder-shared = { workspace = true }
